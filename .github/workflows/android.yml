name: Android verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TCG_LAB_KEYSTORE_BASE64: ${{ secrets.TCG_LAB_KEYSTORE_BASE64 }}
      TCG_LAB_KEYSTORE_PASSWORD: ${{ secrets.TCG_LAB_KEYSTORE_PASSWORD }}
      TCG_LAB_KEY_ALIAS: ${{ secrets.TCG_LAB_KEY_ALIAS }}
      TCG_LAB_KEY_PASSWORD: ${{ secrets.TCG_LAB_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon test assembleDebug

      - name: Check release signing configuration
        id: signing_check
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$TCG_LAB_KEYSTORE_BASE64" ] && [ -n "$TCG_LAB_KEYSTORE_PASSWORD" ] && [ -n "$TCG_LAB_KEY_ALIAS" ] && [ -n "$TCG_LAB_KEY_PASSWORD" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release signing
        if: steps.signing_check.outputs.has_signing == 'true'
        run: |
      - name: Assemble signed release APK
        if: steps.signing_check.outputs.has_signing == 'true'
        env:
          TCG_LAB_KEYSTORE_PATH: $RUNNER_TEMP/tcg-lab-release.jks
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload installable debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: TCG-LAB-v1.0.2-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK
        if: steps.signing_check.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TCG-LAB-v1.0.2-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
